name: FinalCut v14.10 annual planning and task routing
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  annual-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax and save regressions
        run: |
          node --check ui.js
          node --check engine.js
          node tests/v14_8_regression.js
          node tests/v14_5_regression.js
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Annual planning and Next Action browser regression
        run: python tests/v14_10_browser.py
