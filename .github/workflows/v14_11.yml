name: FinalCut v14.11 readability and critic voices
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  readability:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify syntax and legacy production center
        run: |
          node --check ui.js
          node --check engine.js
          node tests/v13_5_production_center.js
          node tests/v14_8_regression.js
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check compact stage layout and responsive film detail tabs
        run: python tests/v14_11_readability_browser.py
