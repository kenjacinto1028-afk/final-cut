name: FinalCut v14.2 responsive save and mobile polish QA
on:
  push:
    branches: [feature/v14-2-save-mobile-polish-20261121]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save, long-archive, finance and v14 gameplay integrity
        run: |
          node --check engine.js
          node --check save-slots.js
          node --check ui.js
          node --check save-worker.js
          node tests/v14_2_async_save.js
          node tests/v14_save_codec.js
          node tests/v14_1_balance.js
          node tests/v14_gameplay.js
          node tests/v13_compat_regression.js
          node tests/v13_4_honors.js
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: 320px, 390px and large archive interactive checks
        run: |
          python tests/v14_2_mobile_browser.py
          python tests/v14_1_mobile_browser.py
          python tests/v13_7_multi_save_browser.py
          python tests/v14_browser.py
