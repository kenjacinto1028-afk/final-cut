name: FinalCut v13.9 short film engagement
on:
  push:
    branches: [feature/short-engagement-v13-9]
  pull_request:
    branches: [main]
jobs:
  shorts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and legacy gameplay suites
        run: |
          node --check engine.js
          node --check ui.js
          node tests/v13_9_short_engagement.js
          node tests/v13_9_short_ten_year_balance.js
          node tests/v13_8_film_finance.js
          node tests/v13_smoke.js
          node tests/v13_5_production_center.js
          node tests/v13_4_honors.js
          node tests/v13_compat_regression.js
          node tests/v13_1_balance.js
      - name: Install headless Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test festival UI, households and existing save manager
        run: |
          python tests/v13_9_short_browser.py
          python tests/v13_8_film_monitor_browser.py
          python tests/v13_6_sitewide_browser.py
          python tests/v13_7_multi_save_browser.py
      - name: Upload screenshots from actual game
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalcut-v13-9-short-real-screens
          path: /tmp/finalcut-v13_9-*.png
          if-no-files-found: ignore
