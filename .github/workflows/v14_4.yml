name: FinalCut v14.4 flexible production regression
on:
  push:
    branches: [v14-4-flexible-production]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, flexible finance and legacy integrity
        run: |
          node --check budget-v14_4.js
          node --check engine.js
          node --check ui.js
          node tests/v14_4_budget.js
          node tests/v14_gameplay.js
          node tests/v13_compat_regression.js
          node tests/v13_9_short_engagement.js
          node tests/v14_2_async_save.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Actual desktop and phone interaction
        run: |
          python tests/v14_2_tutorial_browser.py
          python tests/v14_2_mobile_browser.py
          python tests/v14_3a_filmhub_browser.py
