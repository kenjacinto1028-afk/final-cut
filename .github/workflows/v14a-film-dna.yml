name: FinalCut v14a Film DNA release gate
on:
  push:
    branches: [feature/v14a-film-dna]
  pull_request:
    branches: [main]
jobs:
  film-dna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Film DNA and original gameplay regressions
        run: |
          node --check content.js
          node --check engine.js
          node --check ui.js
          node tests/v14a_film_dna.js
          node tests/v13_9_short_engagement.js
          node tests/v13_9_short_ten_year_balance.js
          node tests/v13_8_film_finance.js
          node tests/v13_5_production_center.js
          node tests/v13_4_honors.js
          node tests/v13_compat_regression.js
          node tests/v13_smoke.js
          node tests/v13_1_balance.js
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify browser, mobile, saves and legacy presentation
        run: |
          python tests/v14a_browser.py
          python tests/v13_7_multi_save_browser.py
          python tests/v13_9_short_browser.py
      - name: Upload real screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalcut-v14a-film-dna
          path: /tmp/finalcut-v14a-*.png
          if-no-files-found: ignore
