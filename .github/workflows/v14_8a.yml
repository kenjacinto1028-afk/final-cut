name: FinalCut v14.8a Dashboard layout polish
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  dashboard-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate game UI syntax
        run: |
          node --check ui.js
          node --check engine.js
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate identity and desktop/mobile wire layout
        run: |
          python -m py_compile tests/v14_8a_layout_browser.py
          python tests/v14_8a_layout_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finalcut-v14-8a-dashboard-layout
          path: |
            /tmp/finalcut-v14-8a-*.png
          if-no-files-found: ignore
