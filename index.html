<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme-ab.css">
<link rel="stylesheet" href="budget-v14_4.css">
<link rel="stylesheet" href="design-v14_7.css">
<link rel="stylesheet" href="mobile-v14_9.css">
</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <div id="content">
    <div class="fc-mobile-header"><div class="fc-mobile-brand">Final Cut<small>STUDIO TYCOON</small></div><button id="mobile-nav-toggle" type="button" aria-expanded="false" aria-controls="nav" onclick="UI.toggleMobileNav()">☰ Menu</button></div>
    <header id="topbar"></header>
    <main id="main"></main>
    <aside id="film-monitor" aria-label="Live project monitor" hidden></aside>
  </div>
  <nav id="mobile-bottom-nav" aria-label="Mobile primary navigation" hidden>
    <button type="button" data-mobile-section="overview" onclick="UI.go('dashboard')"><span class="fc-mobile-icon" aria-hidden="true">⌂</span>Overview</button>
    <button type="button" data-mobile-section="productions" onclick="UI.go('projects')"><span class="fc-mobile-icon" aria-hidden="true">▣</span>Films</button>
    <button type="button" data-mobile-section="people" onclick="UI.go('roster')"><span class="fc-mobile-icon" aria-hidden="true">♙</span>People</button>
    <button type="button" data-mobile-section="industry" onclick="UI.go('market')"><span class="fc-mobile-icon" aria-hidden="true">◇</span>Industry</button>
    <button type="button" data-mobile-section="history" onclick="UI.go('archive')"><span class="fc-mobile-icon" aria-hidden="true">▤</span>History</button>
  </nav>
  <div id="mobile-menu-scrim" aria-hidden="true" onclick="UI.toggleMobileNav()"></div>
</div>
<div id="scrim" hidden></div>
<aside id="drawer" aria-hidden="true"></aside>
<div id="modal" hidden></div>
<div id="year-end-awards" hidden></div>
<div id="premiere-report" hidden></div>
<div id="poster-editor" hidden></div>
<div id="film-action-modal" hidden></div>
<div id="tutorial" hidden></div>
<!-- Fixed load order: content → engine → poster-store → save-slots → media → ui -->
<script src="content.js"></script>
<script src="engine.js"></script>
<script src="poster-store.js"></script>
<script src="save-slots.js"></script>
<script src="media.js"></script>
<script src="design-theme-v14_7.js"></script>
<script src="ui.js"></script>
<script src="tutorial-position.js"></script>
</body>
</html>
